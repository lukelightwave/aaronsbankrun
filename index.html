<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aaron's Bank Run (Sokoban)</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for the game board */
        #gameCanvas {
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            border: 4px solid #333;
            border-radius: 8px;
            touch-action: none; /* Prevents default mobile scrolling/zoom */
            /* Ensure canvas container respects flex/centering */
            display: block; 
            max-width: 100%;
            height: auto;
        }
        /* Make the touch controls look better on mobile */
        #touchControls button {
            transition: all 0.1s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-white font-sans flex flex-col items-center justify-center min-h-screen p-4 overflow-x-hidden">

    <h1 class="text-3xl font-bold mb-4 text-yellow-400">Aaron's Bank Run</h1>
    <p class="text-sm mb-6 text-gray-400 text-center">Push the cash stack (2x1) completely inside the Bank vault (4x4).</p>
    
    <div id="gameContainer" class="flex flex-col items-center justify-center w-full max-w-lg space-y-4">
        <!-- Canvas wrapper is critical for responsive scaling -->
        <canvas id="gameCanvas" class="w-full"></canvas>

        <!-- Instruction and Status Panel -->
        <div id="statusPanel" class="w-full text-center p-2">
            <p id="gameMessage" class="text-lg font-semibold h-6">Move Aaron with Arrow Keys</p>
            <p id="resetHint" class="text-sm text-gray-500 mt-1"></p>
        </div>

        <!-- Touch Controls (Visible on mobile) -->
        <div id="touchControls" class="grid grid-cols-3 gap-3 w-60 mt-4 md:hidden">
            <div></div>
            <button onclick="gameInstance.attemptMove(0, -1)" class="p-3 bg-gray-700 hover:bg-gray-600 rounded-full shadow-lg transition duration-150 active:scale-95">
                <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
            </button>
            <div></div>
            <button onclick="gameInstance.attemptMove(-1, 0)" class="p-3 bg-gray-700 hover:bg-gray-600 rounded-full shadow-lg transition duration-150 active:scale-95">
                <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </button>
            <button onclick="gameInstance.resetGame()" class="p-3 bg-red-600 hover:bg-red-500 rounded-lg shadow-lg text-sm font-bold text-white transition duration-150 active:scale-95">Reset</button>
            <button onclick="gameInstance.attemptMove(1, 0)" class="p-3 bg-gray-700 hover:bg-gray-600 rounded-full shadow-lg transition duration-150 active:scale-95">
                <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
            <div></div>
            <button onclick="gameInstance.attemptMove(0, 1)" class="p-3 bg-gray-700 hover:bg-gray-600 rounded-full shadow-lg transition duration-150 active:scale-95">
                <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
            </button>
            <div></div>
        </div>
    </div>

    <script>
        // --- Configuration ---
        const GRID_WIDTH = 20;
        const GRID_HEIGHT = 15; 
        
        // These variables will be calculated dynamically based on screen size
        let GRID_SIZE;
        let SCREEN_WIDTH;
        let SCREEN_HEIGHT;

        // --- Colors ---
        const BLACK = '#000000';
        const WHITE = '#FFFFFF';
        const SKIN_TONE = '#FFC896';
        const SHIRT_COLOR = '#FFFF00'; 
        const PANTS_COLOR = '#323296';
        const BODY_COLOR = '#C83232'; 
        const HAIR_COLOR = '#323232';
        const CASH_DARK = '#008000';
        const CASH_LIGHT = '#32C832';
        const WALL_COLOR = '#323232';
        const FLOOR_COLOR = '#141428';
        const BANK_COLOR = '#B4B4B4';
        const ROOF_COLOR = '#646464';
        const GOLD = '#FFD700';

        let canvas, ctx;
        let gameInstance;
        let gameContainer; 

        // --- Game Entities (Same as before, relying on calculated GRID_SIZE) ---
        class Entity {
            constructor(x, y, width = 1, height = 1) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
            }

            // IMPORTANT: use the global GRID_SIZE
            getPx(coord) { return coord * GRID_SIZE; }
            getPy(coord) { return coord * GRID_SIZE; }

            getRect() {
                const px = this.getPx(this.x);
                const py = this.getPy(this.y);
                return { x: px, y: py, w: this.width * GRID_SIZE, h: this.height * GRID_SIZE };
            }
        }

        class Player extends Entity {
            constructor(x, y) {
                super(x, y, 1, 1);
                this.isCelebrating = false;
            }

            draw(ctx) {
                const px = this.getPx(this.x);
                const py = this.getPy(this.y);
                const g = GRID_SIZE;

                // Scale drawing elements based on the dynamic GRID_SIZE (g)
                const legWidth = Math.max(2, Math.round(g * 0.2));
                const legHeight = Math.max(3, Math.round(g * 0.25));
                const footHeight = Math.max(1, Math.round(g * 0.1));
                const torsoHeight = Math.max(5, Math.round(g * 0.45));
                const margin = Math.max(2, Math.round(g * 0.1));
                
                const torsoY = py + g - legHeight - footHeight - torsoHeight;
                const torsoX = px + margin;
                const torsoWidth = g - (margin * 2);

                // 1. Legs/Feet (Bottom)
                ctx.fillStyle = PANTS_COLOR;
                ctx.fillRect(px + margin, py + g - legHeight - footHeight, legWidth, legHeight);
                ctx.fillRect(px + g - margin - legWidth, py + g - legHeight - footHeight, legWidth, legHeight);

                // Feet
                ctx.fillStyle = BLACK;
                ctx.fillRect(px + margin, py + g - footHeight, legWidth + 1, footHeight);
                ctx.fillRect(px + g - margin - legWidth - 1, py + g - footHeight, legWidth + 1, footHeight);

                // 2. Torso (Center)
                ctx.fillStyle = SHIRT_COLOR;
                ctx.fillRect(torsoX, torsoY, torsoWidth, torsoHeight);
                
                // 3. Head (Top)
                const headRadius = Math.max(4, Math.round(g * 0.2));
                const headCenterY = torsoY - headRadius - 2;
                const headCenterX = px + g / 2;
                ctx.fillStyle = SKIN_TONE;
                ctx.beginPath();
                ctx.arc(headCenterX, headCenterY, headRadius, 0, Math.PI * 2);
                ctx.fill();
                
                // Hair/Top of Head (Arc)
                ctx.fillStyle = HAIR_COLOR;
                ctx.beginPath();
                ctx.arc(headCenterX, headCenterY, headRadius, 0, Math.PI, true); 
                ctx.fill();

                // 4. Shirt Text ("AAaon") - Scale font size
                const fontSize = Math.max(6, Math.round(g * 0.2));
                ctx.fillStyle = BLACK;
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.textAlign = 'center';
                ctx.fillText('AAaon', headCenterX, torsoY + torsoHeight / 2 + (fontSize / 4));
                
                // 5. Arms and Hands
                const armThickness = Math.max(1, Math.round(g * 0.075));
                const handSize = Math.max(1, Math.round(g * 0.1));
                const shoulderY = torsoY + armThickness;
                
                ctx.strokeStyle = BODY_COLOR;
                ctx.lineWidth = armThickness;
                ctx.lineCap = 'round';

                const drawHand = (x, y) => {
                    ctx.fillStyle = SKIN_TONE;
                    ctx.beginPath();
                    ctx.arc(x, y, handSize, 0, Math.PI * 2);
                    ctx.fill();
                };

                if (this.isCelebrating) {
                    const armReach = Math.round(g * 0.1);
                    // Left Arm (V-shape up)
                    ctx.beginPath();
                    ctx.moveTo(torsoX, shoulderY);
                    ctx.lineTo(px + armReach, py + armReach);
                    ctx.stroke();
                    drawHand(px + armReach, py + armReach);

                    // Right Arm (V-shape up)
                    ctx.beginPath();
                    ctx.moveTo(torsoX + torsoWidth, shoulderY);
                    ctx.lineTo(px + g - armReach, py + armReach);
                    ctx.stroke();
                    drawHand(px + g - armReach, py + armReach);

                } else {
                    // Normal Arms (Down)
                    const armEndY = torsoY + torsoHeight - armThickness;
                    
                    // Left Arm
                    ctx.beginPath();
                    ctx.moveTo(torsoX, shoulderY);
                    ctx.lineTo(torsoX, armEndY);
                    ctx.stroke();
                    drawHand(torsoX, armEndY);
                    
                    // Right Arm
                    ctx.beginPath();
                    ctx.moveTo(torsoX + torsoWidth, shoulderY);
                    ctx.lineTo(torsoX + torsoWidth, armEndY);
                    ctx.stroke();
                    drawHand(torsoX + torsoWidth, armEndY);
                }
            }
        }

        class CashStack extends Entity {
            constructor(x, y) {
                super(x, y, 2, 1); 
            }

            draw(ctx) {
                const px = this.getPx(this.x);
                const py = this.getPy(this.y);
                const totalWidth = this.width * GRID_SIZE;
                const margin = Math.round(GRID_SIZE * 0.1);
                
                // 1. Dark green/shadow base 
                const baseRect = { x: px + margin, y: py + margin, w: totalWidth - margin * 2, h: GRID_SIZE - margin * 2 };
                ctx.fillStyle = CASH_DARK;
                ctx.fillRect(baseRect.x, baseRect.y, baseRect.w, baseRect.h);
                
                // 2. Main Stack Block (lighter green, offset up and left)
                const offset = Math.round(GRID_SIZE * 0.05);
                const stackRect = { x: px + offset, y: py + offset, w: totalWidth - margin * 2, h: GRID_SIZE - margin * 2 };
                ctx.fillStyle = CASH_LIGHT;
                ctx.fillRect(stackRect.x, stackRect.y, stackRect.w, stackRect.h);

                const line_color = '#006400';
                const top_left_x = px + offset;
                const top_left_y = py + offset;
                
                // 3. Top surface details (representing bills)
                ctx.strokeStyle = line_color;
                ctx.lineWidth = 1;
                for (let i = 1; i < 4; i++) {
                    const y_offset = top_left_y + i * (GRID_SIZE / 5) - offset;
                    ctx.beginPath();
                    ctx.moveTo(top_left_x + 4, y_offset);
                    ctx.lineTo(top_left_x + totalWidth - 15, y_offset);
                    ctx.stroke();
                }
                
                // Divider line between the two logical blocks
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(px + GRID_SIZE, top_left_y + margin);
                ctx.lineTo(px + GRID_SIZE, py + GRID_SIZE - margin);
                ctx.stroke();
                
                // 4. Highlight (for shine)
                ctx.strokeStyle = WHITE;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(top_left_x + 4, top_left_y + 4);
                ctx.lineTo(top_left_x + totalWidth - 15, top_left_y + 4);
                ctx.stroke();
                
                // 5. Side shadow
                ctx.fillStyle = '#004600';
                ctx.fillRect(px + totalWidth - margin, py + margin, 2, GRID_SIZE - margin * 2);
            }
        }

        class Bank extends Entity {
            constructor(x, y) {
                super(x, y, 4, 4); 
            }

            draw(ctx) {
                const px = this.getPx(this.x);
                const py = this.getPy(this.y);
                const totalWidth = this.width * GRID_SIZE;
                const totalHeight = this.height * GRID_SIZE;
                
                // 1. Main Building Block 
                const buildingY = py + GRID_SIZE;
                const buildingHeight = totalHeight - GRID_SIZE;
                ctx.fillStyle = BANK_COLOR;
                ctx.fillRect(px, buildingY, totalWidth, buildingHeight);
                
                // 2. Roof 
                ctx.fillStyle = ROOF_COLOR;
                ctx.beginPath();
                ctx.moveTo(px, buildingY);
                ctx.lineTo(px + totalWidth / 2, py); 
                ctx.lineTo(px + totalWidth, buildingY);
                ctx.closePath();
                ctx.fill();
                
                ctx.strokeStyle = BLACK;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(px, buildingY);
                ctx.lineTo(px + totalWidth, buildingY);
                ctx.stroke(); 

                // 3. Vault Door/Entrance (Goal Area)
                const vaultWidth = GRID_SIZE * 1.5;
                const vaultHeight = GRID_SIZE * 1.5;
                const vaultX = px + totalWidth / 2 - vaultWidth / 2;
                const vaultY = py + totalHeight - vaultHeight;
                ctx.fillStyle = GOLD;
                ctx.fillRect(vaultX, vaultY, vaultWidth, vaultHeight); 
                
                // 4. Vault Handle (Circle)
                const handleRadius = Math.max(4, Math.round(GRID_SIZE * 0.1));
                const handleLength = Math.max(5, Math.round(GRID_SIZE * 0.25));
                const vaultCenterX = vaultX + vaultWidth / 2;
                const vaultCenterY = vaultY + vaultHeight / 2;
                ctx.fillStyle = BLACK;
                ctx.beginPath();
                ctx.arc(vaultCenterX, vaultCenterY, handleRadius, 0, Math.PI * 2);
                ctx.fill();

                // Vault Handle (Line)
                ctx.strokeStyle = BLACK;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(vaultCenterX, vaultCenterY);
                ctx.lineTo(vaultCenterX, vaultCenterY - handleLength);
                ctx.stroke();

                // 5. "GRAND BANK" Text on the building - Scale font size
                const bankFontSize = Math.max(8, Math.round(GRID_SIZE * 0.5));
                ctx.fillStyle = BLACK;
                ctx.font = `bold ${bankFontSize}px Arial`;
                ctx.textAlign = 'center';
                ctx.fillText('GRAND BANK', px + totalWidth / 2, py + GRID_SIZE * 1.5 + 8);
            }
        }
        // --- End Entity Classes ---


        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.messageEl = document.getElementById('gameMessage');
                this.hintEl = document.getElementById('resetHint');
                this.gameContainer = document.getElementById('gameContainer');

                // Set up event listeners for resizing, using a dedicated handler
                window.addEventListener('resize', this.handleResize.bind(this));
                
                // 1. Initial size calculation (MUST happen before entity creation)
                this._updateDimensions(); 
                
                // 2. Initialize entities and run initial draw (resetGame calls draw())
                this.gameLoopInterval = null;
                this.resetGame();

                this.setupInput();
                this.startGameLoop();
            }

            // Internal: Update Dimensions Only
            _updateDimensions() {
                // Determine the space available for the canvas (accounting for padding/margins)
                const containerWidth = this.gameContainer.clientWidth;
                const availableWidth = containerWidth - 8; // Subtract a small buffer

                // Calculate max GRID_SIZE based on the available width and height ratio (20:15)
                const maxGridX = Math.floor(availableWidth / GRID_WIDTH);
                
                // Set the GRID_SIZE, capping it at 40 (the desktop ideal size)
                GRID_SIZE = Math.min(40, maxGridX); 
                
                // Update global screen dimensions
                SCREEN_WIDTH = GRID_WIDTH * GRID_SIZE;
                SCREEN_HEIGHT = GRID_HEIGHT * GRID_SIZE;

                // Update canvas dimensions
                this.canvas.width = SCREEN_WIDTH;
                this.canvas.height = SCREEN_HEIGHT;
            }
            
            // Public method for the window resize event
            handleResize() {
                this._updateDimensions();
                this.draw(); // Redraw only when entities are guaranteed to exist
            }

            resetGame() {
                this.player = new Player(1, Math.floor(GRID_HEIGHT / 2));
                this.bank = new Bank(GRID_WIDTH - 5, Math.floor(GRID_HEIGHT / 2) - 2);
                this.cash = new CashStack(3, Math.floor(GRID_HEIGHT / 2)); 
                
                this.gameWon = false;
                this.message = "Move Aaron with Arrow Keys (or touch controls)";
                this.hint = "";
                this.updateUI();
                this.draw();
            }
            
            setupInput() {
                document.addEventListener('keydown', (e) => {
                    if (this.gameWon) {
                        if (e.key === 'r' || e.key === 'R') {
                            this.resetGame();
                        }
                        return;
                    }

                    let dx = 0, dy = 0;
                    switch (e.key) {
                        case 'ArrowUp': dy = -1; break;
                        case 'ArrowDown': dy = 1; break;
                        case 'ArrowLeft': dx = -1; break;
                        case 'ArrowRight': dx = 1; break;
                    }
                    if (dx !== 0 || dy !== 0) {
                        e.preventDefault(); 
                        this.attemptMove(dx, dy);
                    }
                });
            }

            attemptMove(dx, dy) {
                if (this.gameWon) return;

                const newPlayerX = this.player.x + dx;
                const newPlayerY = this.player.y + dy;

                // Check screen bounds for player
                const inBounds = (x, y) => (x > 0 && x < GRID_WIDTH - 1 && y > 0 && y < GRID_HEIGHT - 1);
                if (!inBounds(newPlayerX, newPlayerY)) {
                    return;
                }

                let isPushing = false;
                if (newPlayerX === this.cash.x && newPlayerY === this.cash.y) {
                    isPushing = true; 
                } else if (newPlayerX === this.cash.x + 1 && newPlayerY === this.cash.y) {
                    isPushing = true; 
                }

                if (isPushing) {
                    const newCashX = this.cash.x + dx;
                    const newCashY = this.cash.y + dy;
                    
                    const cashFarX = newCashX + this.cash.width - 1;
                    const isXInBounds = (newCashX > 0 && cashFarX < GRID_WIDTH - 1);
                    const isYInBounds = (newCashY > 0 && newCashY < GRID_HEIGHT - 1);

                    if (isXInBounds && isYInBounds) {
                        this.cash.x = newCashX;
                        this.cash.y = newCashY;
                        this.player.x = newPlayerX;
                        this.player.y = newPlayerY;
                    }
                } else {
                    this.player.x = newPlayerX;
                    this.player.y = newPlayerY;
                }
                this.update();
            }

            update() {
                if (this.gameWon) {
                    this.player.isCelebrating = true;
                    this.updateUI();
                    return;
                }

                // Check win condition
                const cashFullyInsideX = (this.cash.x >= this.bank.x) && 
                                         (this.cash.x + this.cash.width - 1 <= this.bank.x + this.bank.width - 1);
                const cashFullyInsideY = (this.cash.y >= this.bank.y) && 
                                         (this.cash.y + this.cash.height - 1 <= this.bank.y + this.bank.height - 1);

                if (cashFullyInsideX && cashFullyInsideY) {
                    this.gameWon = true;
                    this.message = "SUCCESS! Aaron is celebrating!";
                    this.hint = "Press R or Reset to play again.";
                    this.player.isCelebrating = true;
                } else {
                    this.player.isCelebrating = false;
                    this.message = "Move Aaron with Arrow Keys (or touch controls)";
                    this.hint = "";
                }
                this.updateUI();
            }

            draw() {
                this.ctx.fillStyle = BLACK;
                this.ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
                
                // 1. Draw Walls (Outer Border)
                this.ctx.fillStyle = WALL_COLOR;
                for (let x = 0; x < GRID_WIDTH; x++) {
                    this.ctx.fillRect(x * GRID_SIZE, 0, GRID_SIZE, GRID_SIZE);
                    this.ctx.fillRect(x * GRID_SIZE, (GRID_HEIGHT - 1) * GRID_SIZE, GRID_SIZE, GRID_SIZE);
                }
                for (let y = 1; y < GRID_HEIGHT - 1; y++) {
                    this.ctx.fillRect(0, y * GRID_SIZE, GRID_SIZE, GRID_SIZE);
                    this.ctx.fillRect((GRID_WIDTH - 1) * GRID_SIZE, y * GRID_SIZE, GRID_SIZE, GRID_SIZE);
                }

                // 2. Draw Floor/Play Area
                this.ctx.fillStyle = FLOOR_COLOR;
                this.ctx.fillRect(GRID_SIZE, GRID_SIZE, SCREEN_WIDTH - 2 * GRID_SIZE, SCREEN_HEIGHT - 2 * GRID_SIZE);

                // 3. Draw the Bank goal first (4x4)
                this.bank.draw(this.ctx);
                
                // 4. Draw the Cash stack (2x1)
                this.cash.draw(this.ctx);
                
                // 5. Draw Aaron (Player 1x1)
                this.player.draw(this.ctx);
            }

            startGameLoop() {
                const drawFrame = () => {
                    this.draw();
                    requestAnimationFrame(drawFrame);
                };
                requestAnimationFrame(drawFrame);
            }

            updateUI() {
                this.messageEl.textContent = this.message;
                this.hintEl.textContent = this.hint;

                if (this.gameWon) {
                    this.messageEl.classList.remove('text-lg', 'font-semibold', 'text-yellow-400');
                    this.messageEl.classList.add('text-2xl', 'font-extrabold', 'text-green-400');
                } else {
                    this.messageEl.classList.add('text-lg', 'font-semibold', 'text-yellow-400');
                    this.messageEl.classList.remove('text-2xl', 'font-extrabold', 'text-green-400');
                }
            }
        }

        window.onload = () => {
            // Updated to ensure button handlers call the correct global instance
            const touchButtons = document.querySelectorAll('#touchControls button');
            touchButtons.forEach(button => {
                const onclickAttr = button.getAttribute('onclick');
                if (onclickAttr) {
                    button.setAttribute('onclick', onclickAttr.replace('game.', 'gameInstance.'));
                }
            });

            gameInstance = new Game();
        };
    </script>
</body>
</html>
